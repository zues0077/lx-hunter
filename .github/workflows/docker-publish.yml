name: Publish Docker image to GHCR

# 发版策略（2026-11-07 起，对齐 lx-music/lxserver 操作手册 P-0818 / P-0801 / P-0812）：
#   1. 推 main **不再构建镜像**，也不再消耗 Actions 分钟，只做代码托管（静默）。
#   2. 只有打 vX.Y.Z tag 才出正式镜像；且 tag 必须与 package.json 版本完全一致，
#      否则构建直接失败（Verify 步骤护栏），杜绝「镜像 tag 与 /health 返回版本错位」。
#   3. 想在 246 实机试跑而不发版：Actions 页手动 Run workflow_dispatch，
#      产物 tag 为 test-<短SHA>，不覆盖 latest、不动版本号。
# 根因教训：v1.10.2 初版漏改 package.json（仍是 1.10.1），且旧流程推 main 就构建并改 latest，
# 导致界面/health 显示 1.10.1。本文件已加版本一致性校验 + main 静默，堵死此坑。
# 注：lx-hunter 版本来源只有 package.json（无 config.js），故 bump package.json 即同步 /health 与界面。
# 平台保持 linux/amd64,linux/arm64（246 为 x86_64；未加 armv7，如需兼容老 ARM 设备再补）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      test_tag:
        description: '测试镜像后缀（留空则用 commit 短 SHA，产物形如 test-abc1234）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version and short SHA
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "版本号: $VERSION  commit: $SHORT"

      # 打 tag 时强制 tag 与 package.json 一致，避免镜像 tag 与代码版本错位
      # （这是 v1.10.2 错位事故的根因护栏）
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "v${{ steps.v.outputs.version }}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 v${{ steps.v.outputs.version }} 不一致"
            exit 1
          fi
          echo "tag 校验通过：${GITHUB_REF_NAME}"

      # 多架构只在发版时构建；手动测试构建只出 amd64，省一半时间
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=v${{ steps.v.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.v.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=raw,value=test-${{ inputs.test_tag != '' && inputs.test_tag || steps.v.outputs.short }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=LX Music 音源猎手 / 音源采集与同步服务
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 发版：amd64 + arm64；手动测试：只出 amd64，省一半时间
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 删除「未被任何当前 tag 引用的孤儿 digest」。
  # 关键点：GHCR 里多架构镜像的 amd64/arm64 子清单是独立的「无 tag 版本」，
  # 但它们被各版本 tag 的索引引用——必须保留，否则索引悬空 → pull 报 manifest unknown。
  # 保留集合 = 所有「带 tag」的版本 digest + 递归引用的子 digest/config/layers，只删集合外的。
  # tag 名单从 Packages API 动态获取（分页拉全），不硬编码，版本号变化也不会漏。
  #
  # 历史事故记录（2026-10-14，两个 bug 都踩过）：
  #   bug1：manifest URL 写成 /v2/<name>/（漏了 owner）→ 全部 400 NAME_INVALID，
  #         node 解析错误 JSON 不报错、只是没有输出 → 递归静默失效 → 子清单被当孤儿删光 →
  #         索引悬空 → NAS 拉取报 manifest unknown。
  #   bug2：GITHUB_TOKEN 直接 Bearer 调 ghcr.io /v2/ → 403 UNAUTHORIZED（docker login 能用
  #         是因为守护进程自动去 token 端点换了令牌）。递归同样静默失效，靠年龄保护才没误删。
  #   修复：URL 用完整 owner/name；先用 Basic 认证经 token 端点换取 REG_TOKEN 并预检，失败即终止。
  cleanup:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete orphaned package versions only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: https://api.github.com
          REG: https://ghcr.io
          PKG: ${{ env.IMAGE_NAME }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          # PKG  = zues0077/lx-hunter（完整 owner/name，registry manifest URL 必须用它）
          # NAME = lx-hunter（仅用于 Packages API 路径，owner 在 URL 里单独一段）
          NAME="${PKG#*/}"
          ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"
          echo "== 清理 $OWNER 的 container 包：$NAME（registry 路径：$PKG）=="

          # 0) 分页拉全量版本列表（带 tag 的版本不一定落在第一页，必须翻完再算保留集合）
          PDIR=$(mktemp -d); PAGE=1
          while :; do
            curl -sS -o "$PDIR/$PAGE.json" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/users/$OWNER/packages/container/$NAME/versions?per_page=100&page=$PAGE"
            N=$(jq 'length' "$PDIR/$PAGE.json" 2>/dev/null || echo 0)
            [ "$N" -lt 100 ] && break
            PAGE=$((PAGE+1)); [ "$PAGE" -gt 20 ] && break
          done
          LIST=$(jq -s 'add' "$PDIR"/*.json)
          if ! echo "$LIST" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::版本列表 API 返回异常，终止清理"; exit 1
          fi

          # 0.5) 换取 registry token：GITHUB_TOKEN 不能直接 Bearer 调 ghcr.io /v2/
          #      （会 403 UNAUTHORIZED——docker login 能用是因为守护进程自动去 token 端点换了令牌）。
          #      必须经 token 端点 Basic 认证换取，换不到就直接终止，绝不在认证存疑时继续。
          REG_TOKEN=$(curl -sS -m 20 "https://ghcr.io/token?scope=repository:${PKG}:pull&service=ghcr.io" \
            -u "${OWNER}:${GH_TOKEN}" | jq -r '.token // empty')
          if [ -z "$REG_TOKEN" ]; then
            echo "::error::无法获取 ghcr.io registry token，终止清理（不做任何删除）"; exit 1
          fi
          # 0.6) 令牌预检：拉第一个带 tag 的索引，非 200 即终止（此时还没有任何删除动作）
          PROBE=$(echo "$LIST" | jq -r '.[] | select((.metadata.container.tags // []) | length > 0) | .name' | head -1)
          if [ -n "$PROBE" ]; then
            PC=$(curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $REG_TOKEN" -H "Accept: $ACCEPT" \
              "$REG/v2/$PKG/manifests/$PROBE")
            if [ "$PC" != "200" ]; then
              echo "::error::registry 令牌预检失败（$PROBE -> HTTP $PC），终止清理"; exit 1
            fi
            echo "registry 令牌预检通过（$PROBE -> 200）"
          fi

          # 1) 保留集合种子 = 所有「带 tag」的版本 digest（不硬编码 tag 名，版本号变化也不会漏）
          KEEP=$(mktemp); QUEUE=$(mktemp)
          echo "$LIST" | jq -r '.[] | select((.metadata.container.tags // []) | length > 0) | .name' > "$QUEUE"
          # 保险：保留集合为空说明 API 出了故障，此时删任何东西都是灾难，直接终止
          if [ ! -s "$QUEUE" ]; then
            echo "::error::没有任何带 tag 的版本，终止清理"; exit 1
          fi

          # 2) 递归展开：索引 -> 子清单（amd64/arm64/attestation）-> config/layers
          #    ⚠️ manifest URL 必须是 $REG/v2/$PKG/manifests/... （完整 owner/name）。
          #       写成 $NAME（缺 owner）会 400 NAME_INVALID，且 node 解析错误 JSON 不报错、
          #       只是没有输出——递归会静默失效，进而误删全部子清单。
          while [ -s "$QUEUE" ]; do
            NEXT=$(mktemp)
            while read -r D; do
              case "$D" in sha256:*) ;; *) continue ;; esac
              grep -qxF "$D" "$KEEP" && continue
              echo "$D" >> "$KEEP"
              BODY=$(mktemp)
              CODE=$(curl -sS -o "$BODY" -w "%{http_code}" \
                -H "Authorization: Bearer $REG_TOKEN" -H "Accept: $ACCEPT" \
                "$REG/v2/$PKG/manifests/$D")
              if [ "$CODE" != "200" ]; then
                echo "::warning::manifest $D 拉取失败 HTTP $CODE，跳过递归"
                rm -f "$BODY"; continue
              fi
              node -e 'let s=require("fs").readFileSync(process.argv[1],"utf8");try{const m=JSON.parse(s);(m.manifests||[]).forEach(x=>console.log(x.digest));if(m.config&&m.config.digest)console.log(m.config.digest);(m.layers||[]).forEach(x=>console.log(x.digest))}catch(e){}' "$BODY"
              rm -f "$BODY"
            done < "$QUEUE" >> "$NEXT"
            sort -u "$NEXT" -o "$NEXT"; mv "$NEXT" "$QUEUE"
          done
          echo "保留集合（$(wc -l < "$KEEP") 个 digest）："; cat "$KEEP"

          # 3) 删除「name 形如 sha256、不在保留集合、且创建超过 5 分钟」的版本。
          #    5 分钟年龄保护：避免与并发/刚完成的推送竞态，误删尚未被索引引用到的子清单。
          CUTOFF=$(( $(date +%s) - 300 ))
          echo "$LIST" | jq -r --argjson cutoff "$CUTOFF" \
            '.[] | select((.created_at | fromdateiso8601) < $cutoff) | "\(.id) \(.name)"' \
          | while read -r id nm; do
            case "$nm" in sha256:[0-9a-f]*) ;; *) continue ;; esac
            if ! grep -qx "$nm" "$KEEP"; then
              code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$API/users/$OWNER/packages/container/$NAME/versions/$id")
              echo "删除孤儿版本 $id ($nm) -> HTTP $code"
            else
              echo "保留 $id ($nm)"
            fi
          done

          # 4) 悬空自检：每个带 tag 的索引，其子清单必须全部可达。
          #    有任何悬空即 ::error:: 并以非零退出——宁可构建红，也不要静默留坏镜像。
          echo "== 悬空自检 =="
          BAD=0
          while read -r D; do
            case "$D" in sha256:*) ;; *) continue ;; esac
            BODY=$(mktemp)
            CODE=$(curl -sS -o "$BODY" -w "%{http_code}" \
              -H "Authorization: Bearer $REG_TOKEN" -H "Accept: $ACCEPT" \
              "$REG/v2/$PKG/manifests/$D")
            if [ "$CODE" != "200" ]; then
              echo "::error::带 tag 索引 $D 不可达 HTTP $CODE"; BAD=1; rm -f "$BODY"; continue
            fi
            SUBS=$(node -e 'let s=require("fs").readFileSync(process.argv[1],"utf8");try{const m=JSON.parse(s);(m.manifests||[]).forEach(x=>console.log(x.digest))}catch(e){}' "$BODY")
            rm -f "$BODY"
            while read -r S; do
              case "$S" in sha256:*) ;; *) continue ;; esac
              SC=$(curl -sS -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $REG_TOKEN" -H "Accept: $ACCEPT" \
                "$REG/v2/$PKG/manifests/$S")
              if [ "$SC" != "200" ]; then
                echo "::error::索引 $D 的子清单 $S 不可达 HTTP $SC（悬空！）"; BAD=1
              fi
            done <<< "$SUBS"
          done < <(echo "$LIST" | jq -r '.[] | select((.metadata.container.tags // []) | length > 0) | .name')
          if [ "$BAD" = "1" ]; then
            echo "::error::存在悬空 tag，需要重建或 retag 修复"; exit 1
          fi
          echo "自检通过：所有带 tag 的镜像结构完整"
