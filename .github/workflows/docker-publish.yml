name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 只保留带 tag 的当前版本；删除历史推送遗留的无 tag digest，
  # 避免旧 digest 仍可被匿名按 digest 拉取。
  cleanup:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete untagged package versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: https://api.github.com
          PKG: ${{ env.IMAGE_NAME }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          NAME="${PKG#*/}"
          echo "== 清理 $OWNER 的 container 包：$NAME =="
          LIST=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/users/$OWNER/packages/container/$NAME/versions?per_page=100")
          echo "$LIST" | jq -r 'if type=="array" then .[] | select((.metadata.container.tags // []) | length == 0) | .id else empty end' \
            | while read -r id; do
              [ -z "$id" ] && continue
              code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API/users/$OWNER/packages/container/$NAME/versions/$id")
              echo "删除无 tag 版本 $id -> HTTP $code"
            done
          echo "== 剩余版本 =="
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/users/$OWNER/packages/container/$NAME/versions?per_page=100" \
            | jq -r '.[] | "\(.id)  tags=\(.metadata.container.tags // [])  \(.created_at)"'
